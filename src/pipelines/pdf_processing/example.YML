resources:
  jobs:
    pdf_to_txt_from_git:
      name: pdf_to_txt_from_git
      tasks:
        - task_key: clone_of_pdf_to_text_from_git_CY
          spark_python_task:
            python_file: src/pipelines/pdf_processing/pdf_to_text_with_pymupdfllm.py
            parameters:
              - --source_path
              - "{{job.parameters.base_path}}/pdf/source=CY/"
              - --target_path
              - "{{job.parameters.base_path}}/txt/source=CY/"
            source: GIT
          environment_key: dev
        - task_key: pdf_to_text_from_git
          spark_python_task:
            python_file: src/pipelines/pdf_processing/pdf_to_text_with_pymupdfllm.py
            parameters:
              - --source_path
              - "{{job.parameters.base_path}}/pdf/source=UTB/"
              - --target_path
              - "{{job.parameters.base_path}}/txt/source=UTB/"
            source: GIT
          environment_key: dev
        - task_key: text_to_columns_cy
          depends_on:
            - task_key: clone_of_pdf_to_text_from_git_CY
          spark_python_task:
            python_file: src/pipelines/pdf_processing/text_to_columns.py
            parameters:
              - --source_path
              - "{{job.parameters.base_path}}/txt/source=CY/"
              - --target_table
              - "{{job.parameters.loads_table}}"
            source: GIT
          environment_key: dev
        - task_key: txt_to_columns
          depends_on:
            - task_key: pdf_to_text_from_git
          spark_python_task:
            python_file: src/pipelines/pdf_processing/text_to_columns.py
            parameters:
              - --source_path
              - "{{job.parameters.base_path}}/txt/source={{job.parameters.sourc\
                e_name}}/"
              - --target_table
              - "{{job.parameters.loads_table}}"
            source: GIT
          environment_key: dev
        - task_key: text_to_columns_validator
          depends_on:
            - task_key: txt_to_columns
            - task_key: text_to_columns_cy
          spark_python_task:
            python_file: src/pipelines/pdf_processing/text_to_columns_validator.py
            parameters:
              - --source_table
              - "{{job.parameters.loads_table}}"
            source: GIT
          environment_key: dev
      git_source:
        git_url: https://github.com/JuanVille15/pdf_processing.git
        git_provider: gitHub
        git_branch: dev
      queue:
        enabled: true
      parameters:
        - name: base_path
          default: /Volumes/logistics/bronze/raw
        - name: loads_table
          default: logistics.bronze.truckr_loads
        - name: source_name
          default: UTB
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
        - environment_key: dev
          spec:
            dependencies:
              - PyMuPDF==1.26.4
              - pymupdf4llm==0.0.27
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
